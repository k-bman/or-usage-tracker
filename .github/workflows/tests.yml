# Runs the test suite and a secret scan on every push and pull request.
#
# Qt runs on the offscreen platform plugin because there is no display on a
# runner; the tests are written to work headless.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest first: 3.10 is the floor declared in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySide6 links against Qt's native libraries, which the runner image
      # does not ship. Without these, importing PySide6.QtGui fails with
      # "libEGL.so.1: cannot open shared object file" before any test runs.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # This step runs outside pytest, so tests/conftest.py never loads here --
      # the platform has to be set explicitly for the check to mean anything.
      - name: Verify PySide6 imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtGui import QGuiApplication; print('PySide6 imports OK')"

      # No QT_QPA_PLATFORM here on purpose. tests/conftest.py forces the
      # offscreen platform for every pytest run, and leaving it out of the
      # environment means CI actually exercises that guarantee instead of
      # hiding it behind a runner-only fallback.
      - name: Run tests
        run: python -m pytest tests/ -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan needs the full clone, not a shallow one.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git . --redact --verbose