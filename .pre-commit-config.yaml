# Pre-commit hooks for or-usage-tracker.
#
# Only one hook: fail the commit when staged changes contain hardcoded
# secrets (API keys, private keys, tokens).
#
# `repo: local` + `language: system` runs the gitleaks binary from PATH
# (packaged by Arch as `gitleaks`) instead of pre-compiling it in a Go
# toolchain, so there is nothing to download on first run.
#
# Setup:
#   sudo pacman -S gitleaks pre-commit
#   pre-commit install
#
# Notes:
#   - This scans staged content at commit time, not history.
#   - It can be bypassed with `git commit --no-verify` or `SKIP=gitleaks`.
#   - False positives are handled by scoping entries in .gitleaks.toml.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        description: Fail the commit if staged changes contain API keys or similar
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false